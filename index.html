<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Elegant Jewelry</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #ffe0f0, #e0f7ff);
    }

    header {
      background: #ff69b4;
      color: white;
      text-align: center;
      padding: 25px;
    }

    header h1 {
      margin: 0;
    }

    .container {
      padding: 30px;
      text-align: center;
    }

    .model {
      max-width: 300px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .jewelry-list {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .item {
      background: white;
      padding: 20px;
      width: 200px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.3s;
    }

    .item:hover {
      transform: scale(1.05);
      background: #fff0f8;
    }

    .item img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
    }

    footer {
      background: #ff69b4;
      color: white;
      text-align: center;
      padding: 12px;
      margin-top: 40px;
    }
  </style>

</head>
<body>

  <header>
    <h1>✨ Elegant Jewelry ✨</h1>
    <p>Beauty that shines with you</p>
  </header>

  <div class="container">
    <h2>Our Model Wearing Jewelry</h2>

    <img
      class="model"
      src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e"
      alt="Girl wearing jewelry"
    >

    <h2>Jewelry Collection</h2>

    <div class="jewelry-list">
      <div class="item" onclick="showMessage('Earrings')">
        <img src="https://images.unsplash.com/photo-1617038220319-276d3cfab638">
        <p>Earrings</p>
      </div>

      <div class="item" onclick="showMessage('Locket')">
        <img src="https://images.unsplash.com/photo-1602526216432-77f9f47f76f7">
        <p>Locket</p>
      </div>

      <div class="item" onclick="showMessage('Necklace')">
        <img src="https://images.unsplash.com/photo-1605106702842-01a887a31122">
        <p>Necklace</p>
      </div>
    </div>
  </div>

  <footer>
    © 2026 Elegant Jewelry 💖
  </footer>

  <script>
    function showMessage(item) {
      alert(item + " selected 💎");
    }
  </script>

</body>
</html>
